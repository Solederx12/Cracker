name: Build Kurdish80p Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        brew install dpkg ldid

    - name: Setup Theos Framework & Native iOS SDK
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        mkdir -p $HOME/theos/sdks
        
        # دۆزینەوەی ڕێڕەوی فەرمی SDK ی ئایفۆن لە ناو مەکۆس بەبێ داونلۆد
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Found iOS SDK at: $SDK_PATH"
        
        # بەستنەوەی ڕاستەوخۆی SDK ی ناو Xcode بۆ ناو فۆڵدەری ئەپڵیکەیشنەکە
        ln -s "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk

    - name: Compile Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kurdish80p-Tweak
        path: packages/*.deb
