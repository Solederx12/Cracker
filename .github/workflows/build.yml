name: Build Kurdish80p Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        brew install dpkg ldid

    - name: Setup Theos Framework & Official SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        rm -rf $HOME/theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks

    - name: Auto-Fix Makefile & Generate Missing Plist Filter
      run: |
        # 1. ڕاستکردنەوەی ئۆتۆماتیکی ناوی پلاتفۆرم لە میکفایلدا
        if [ -f Makefile ]; then
          sed -i '' 's/iphoneos/iphone/g' Makefile 2>/dev/null || sed -i 's/iphoneos/iphone/g' Makefile 2>/dev/null
        fi
        
        # 2. دروستکردنی فایلی Plist ئەگەر لە ناو پڕۆژەکەدا نەبوو بۆ تێپەڕاندنی ئیرۆرەکە
        if [ ! -f Kurdish80p.plist ] && [ ! -f Filter.plist ]; then
          echo "Generating missing Kurdish80p.plist file..."
          cat << 'EOF' > Kurdish80p.plist
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Filter</key>
        <dict>
            <key>Bundles</key>
            <array>
                <string>com.miniclip.8ballpool</string>
            </array>
        </dict>
    </dict>
    </plist>
    EOF
        fi

    - name: Compile Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1 TARGET=iphone:clang:latest

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kurdish80p-Tweak
        path: packages/*.deb
