name: Build Kurdish80p Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        brew install dpkg ldid

    - name: Setup Theos Framework
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Compile Package
      run: |
        export THEOS=$HOME/theos
        
        # دۆزینەوەی ڕێڕەوی ئەسڵی iOS SDK لە ناو مەکۆس
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # ناچارکردنی تویگەکە بۆ کۆمپایلکردن بۆ ئایفۆن بە بەکارهێنانی پاشکۆی فەرمی ئەپڵ
        make package FINALPACKAGE=1 TARGET=iphoneos:clang:latest SYSROOT="$SDK_PATH"

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kurdish80p-Tweak
        path: packages/*.deb
