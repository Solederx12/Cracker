name: Build Kurdish80p Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Theos environment
      uses: theos/theos-action@v1

    - name: Compile Package
      run: |
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Kurdish80p-Tweak
        path: packages/*.deb
